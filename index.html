<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario UNID</title>
    <link rel="stylesheet" href="estilos.css">

    <link rel="icon" type="image/png" href="./favicon_io/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon_io/favicon.svg" />
    <link rel="shortcut icon" href="./favicon_io/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon_io/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./favicon_io/site.webmanifest" />

    <meta property="og:title" content="Formulario UNID" />
    <meta property="og:description" content="Envía tus datos y trámites directamente por WhatsApp." />
    <meta property="og:image" content="https://aidancj.github.io/formulario-unid/favicon/apple-touch-icon.png" />
    <meta property="og:type" content="website" />

</head>
<body>

    <div class="form-container">
        <img id="logo" src="logoUNID.png" alt="LOGO UNID">
        <h2>Formulario</h2>
        <form id="whatsappForm">

            <label for="name">Nombre del Alumno:</label>
            <input type="text" id="name" required>

            <label for="issue">Asunto o Trámite:</label>
            <select id="issue" required>
                <option value="" disabled selected>Selecciona una opción...</option>
                <option value="Inscripción">Inscripción</option>
                <option value="Constancia de Estudios">Constancia de Estudios</option>
                <option value="Servicio Social">Servicio Social</option>
                <option value="Estadía">Estadía</option>
                <option value="Pagos">Pagos</option>
                <option value="Duda General">Duda General</option>
            </select>

            <button type="submit">Enviar a WhatsApp</button>
        </form>
    <p class = "derechos">&copy;2026 Desarrollado por Ian Aidan Cárdenas Juárez. Todos los derechos reservados.</p>
    </div>

    <script src="whatsApp.js"></script>
</body>
</html>
