<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario UNID</title>
    <link rel="stylesheet" href="estilos.css">

    <link rel="icon" type="image/png" href="./favicon_io/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon_io/favicon.svg" />
    <link rel="shortcut icon" href="./favicon_io/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon_io/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./favicon_io/site.webmanifest" />

    <meta property="og:title" content="Formulario UNID" />
    <meta property="og:description" content="Envía tus datos y trámites directamente por WhatsApp." />
    <meta property="og:image" content="https://aidancj.github.io/formulario-unid/favicon/apple-touch-icon.png" />
    <meta property="og:type" content="website" />

</head>
<body>

    <div class="form-container">
        <img id="logo" src="logoUNID.png" alt="LOGO UNID">
        <h2>Formulario</h2>
        <form id="whatsappForm">

            <label for="nombreAlumno">Nombre del Alumno:</label>
            <input type="text" id="nombreAlumno" required>

            <label for="fechaNacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fechaNacimiento" required>
                
            <label for="estadoCivil">Estado civil:</label>
            <select id = "estadoCivil" name="estadoCivil" required>
                <option value="" disabled selected> Selecciona una opción...</option>
                <option value="soltero">Soltero(a)</option>
                <option value="casado">Casado(a)</option>
                <option value="divorciado">Divorciado(a)</option>
                <option value="viudo">Viudo(a)</option>
                <option value="unionLibre">Unión Libre</option>
            </select>
                
            <label for="lugarNacimiento">Lugar de nacimiento:</label>
            <input type="text" id="lugarNacimiento" required>
                
            <label for="correo">Correo Electrónico:</label>
            <input type="mail" id="correo" required>
                
            <label for="curp">CURP:</label>
            <input type="text" id="curp" minlength="18" maxlength="18" required>
   
            <label for="numeroTelefonico">Número Telefónico:</label>
            <input type="text" id="numeroTelefonico" required>
                
            <label for="numeroCasa">Número de casa (en caso de tenerlo):</label>
            <input type="text" id="numeroCasa">
            
            <label for="direccion">Dirección de casa (calle, colonia, ciudad, estado y código postal):</label>
            <input type="text" id="direccion" required>
                
            <label for="nombreTutor">Nombre del Tutor:</label>
            <input type="text" id="nombreTutor" required>
                
            <label for="numeroTutor">Número del tutor:</label>
            <input type="text" id="numeroTutor" required>

            <button type="submit">Enviar a WhatsApp</button>
        </form>
    <p class = "derechos">&copy;2026 Desarrollado por Ian Aidan Cárdenas Juárez. Todos los derechos reservados.</p>
    </div>

    <script src="whatsApp.js"></script>
</body>
</html>
